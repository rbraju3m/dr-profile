faqs:
  - group: "appointment"
    question_en: "How do I take an appointment?"
    question_bn: "কীভাবে অ্যাপয়েন্টমেন্ট নেব?"
    answer_en: "<p>Use the booking form on this site. Choose the chamber, pick a date, choose a free time and enter your name and mobile number. You receive a serial number straight away. You can also call the chamber number listed on the contact page.</p>"
    answer_bn: "<p>এই সাইটের বুকিং ফর্ম ব্যবহার করুন। চেম্বার নির্বাচন করুন, তারিখ বাছুন, খালি সময় বেছে নিন এবং আপনার নাম ও মোবাইল নম্বর দিন। সঙ্গে সঙ্গেই সিরিয়াল নম্বর পাবেন। চাইলে যোগাযোগ পাতায় দেওয়া নম্বরেও কল করতে পারেন।</p>"

  - group: "appointment"
    question_en: "When does the chamber sit?"
    question_bn: "চেম্বার কখন বসে?"
    # Deliberately points at the Chambers page rather than repeating the times:
    # this answer was written when there was one chamber and went stale the day
    # a second was added. The page and the booking form both read the schedule
    # rows, so they cannot drift.
    answer_en: "<p>He now sits at three chambers, and the days and times differ. Each chamber's weekly schedule is listed on the Chambers page, and the booking form shows only the times that are actually free.</p>"
    answer_bn: "<p>তিনি এখন তিনটি চেম্বারে বসেন এবং প্রতিটির দিন ও সময় আলাদা। প্রতিটি চেম্বারের সাপ্তাহিক সময়সূচি “চেম্বার” পাতায় দেওয়া আছে, আর বুকিং ফর্মে কেবল প্রকৃত খালি সময়গুলোই দেখানো হয়।</p>"

  - group: "appointment"
    question_en: "How far ahead can I book?"
    question_bn: "কত দিন আগে বুক করা যায়?"
    answer_en: "<p>Online booking is open for the next thirty days. For a date beyond that, please call the chamber.</p>"
    answer_bn: "<p>অনলাইনে আগামী ত্রিশ দিনের জন্য বুকিং করা যায়। এর পরের তারিখের জন্য চেম্বারে কল করুন।</p>"

  - group: "appointment"
    question_en: "Until when can I take a serial for tonight?"
    question_bn: "আজ সন্ধ্যার সিরিয়াল কখন পর্যন্ত নেওয়া যাবে?"
    answer_en: "<p>Online serials close one hour before the sitting begins. After that, please call the chamber.</p>"
    answer_bn: "<p>বসার এক ঘণ্টা আগে অনলাইন সিরিয়াল বন্ধ হয়ে যায়। এরপর চেম্বারে কল করুন।</p>"

  - group: "appointment"
    question_en: "Can I cancel or change my appointment?"
    question_bn: "অ্যাপয়েন্টমেন্ট বাতিল বা পরিবর্তন করা যাবে?"
    answer_en: "<p>Yes. Open your confirmation page using the serial number, confirm the mobile number you booked with, and cancel. The time is released for another patient. You can also call the chamber.</p>"
    answer_bn: "<p>হ্যাঁ। সিরিয়াল নম্বর দিয়ে আপনার নিশ্চিতকরণ পাতাটি খুলুন, বুকিংয়ের সময় ব্যবহৃত মোবাইল নম্বরটি নিশ্চিত করুন এবং বাতিল করুন। সময়টি অন্য রোগীর জন্য খুলে যাবে। চাইলে চেম্বারেও কল করতে পারেন।</p>"

  - group: "appointment"
    question_en: "What should I bring with me?"
    question_bn: "সঙ্গে কী কী আনতে হবে?"
    answer_en: "<p>Any previous X-rays and MRI films, all earlier reports and prescriptions, and the actual strips of every medicine you are taking now.</p>"
    answer_bn: "<p>পূর্ববর্তী এক্স-রে ও এমআরআই ফিল্ম, আগের সব রিপোর্ট ও ব্যবস্থাপত্র এবং বর্তমানে যেসব ওষুধ খাচ্ছেন সেগুলোর পাতা।</p>"

  - group: "fees"
    question_en: "Do I pay when I book online?"
    question_bn: "অনলাইনে বুক করার সময় কি টাকা দিতে হয়?"
    answer_en: "<p>No. Booking online reserves a serial number only; no payment is taken on this site. You pay at the chamber counter on the day of your visit.</p>"
    answer_bn: "<p>না। অনলাইনে বুকিং শুধু সিরিয়াল নম্বর সংরক্ষণ করে; এই সাইটে কোনো টাকা নেওয়া হয় না। ভিজিটের দিন চেম্বারের কাউন্টারে পরিশোধ করবেন।</p>"

  - group: "treatment"
    question_en: "Which problems does he treat?"
    question_bn: "তিনি কোন কোন সমস্যার চিকিৎসা করেন?"
    answer_en: "<p>Orthopaedic surgery, spine surgery, joint and knee pain, bone deformities and congenital problems, sports injuries, and long-term pain management. Each of these is described under Expertise.</p>"
    answer_bn: "<p>অর্থোপেডিক সার্জারি, স্পাইন সার্জারি, জয়েন্ট ও হাঁটু ব্যথা, হাড়ের বিকৃতি ও জন্মগত সমস্যা, স্পোর্টস ইনজুরি এবং দীর্ঘমেয়াদি ব্যথা ব্যবস্থাপনা। প্রতিটি সম্পর্কে বিস্তারিত “বিশেষজ্ঞতা” অংশে আছে।</p>"

