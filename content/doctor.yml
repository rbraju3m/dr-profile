  title_bn: "ডা."
  name_en: "Shaikh Saadiul Islam"
  # Bangla spelling of a person's name is worth getting from him directly
  # rather than transliterating. Blank means Bangla visitors see the English.
  name_bn: ""

  designation_en: "REPLACE ME"        # e.g. Consultant, <specialty>
  designation_bn: ""
  tagline_en: ""
  tagline_bn: ""

  degrees_en: "REPLACE ME"            # exactly as he lists them
  degrees_bn: ""

  bmdc_reg_no: "REPLACE ME"           # verify against the BMDC register
  experience_years: 0

  gender: ""
  languages_en: "Bangla, English"
  languages_bn: "বাংলা, ইংরেজি"

  short_bio_en: "REPLACE ME"
  short_bio_bn: ""
  bio_en: "REPLACE ME"
  bio_bn: ""
