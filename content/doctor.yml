# ============================================================================
#  Dr Shaikh Saadiul Islam
# ----------------------------------------------------------------------------
#  Only the name is filled in. It is the sole detail that was publicly visible;
#  everything else on the Facebook page sits behind a login wall.
#
#  Every "REPLACE ME" below is refused by the importer rather than written, so
#  this file is safe to import at any stage of completion. Fill in what you
#  have, run `php artisan doctor:import`, repeat as more details arrive.
#
#  The registration number must be checked against the BMDC register before the
#  site goes live. It appears on the profile page and patients rely on it.
# ============================================================================

profile:
