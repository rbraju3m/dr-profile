  short_bio_en: "Dr. Imran Kabir is a consultant cardiologist with sixteen years of clinical practice. He runs a general cardiology clinic alongside a dedicated service for blood pressure that has not responded to treatment."
  short_bio_bn: "ডা. ইমরান কবির একজন কনসালট্যান্ট কার্ডিওলজিস্ট, যাঁর ষোলো বছরের চিকিৎসা অভিজ্ঞতা রয়েছে। সাধারণ কার্ডিওলজি সেবার পাশাপাশি তিনি নিয়ন্ত্রণে না আসা উচ্চ রক্তচাপের জন্য বিশেষ ক্লিনিক পরিচালনা করেন।"

  bio_en: "<p>Dr. Imran Kabir completed his MBBS in 2009, followed by FCPS in Medicine and an MD in Cardiology. He has since worked across public and private practice in Dhaka.</p><p>His consultations are built around one habit: nothing is prescribed until the patient can explain, in their own words, what the problem is and why the treatment helps. Reports are read aloud and a written summary goes home with every patient.</p><p>He keeps a standing interest in medication review, and a first appointment usually ends with fewer tablets than it began with.</p>"
  bio_bn: "<p>ডা. ইমরান কবির ২০০৯ সালে এমবিবিএস সম্পন্ন করেন, এরপর মেডিসিনে এফসিপিএস এবং কার্ডিওলজিতে এমডি ডিগ্রি অর্জন করেন। তারপর থেকে তিনি ঢাকার সরকারি ও বেসরকারি উভয় ক্ষেত্রেই কাজ করেছেন।</p><p>তাঁর পরামর্শের কেন্দ্রে একটি অভ্যাস — রোগী নিজের ভাষায় সমস্যাটি এবং চিকিৎসা কেন প্রয়োজন তা ব্যাখ্যা করতে না পারা পর্যন্ত কোনো ওষুধ দেওয়া হয় না। রিপোর্ট পড়ে শোনানো হয় এবং প্রত্যেক রোগী লিখিত সারসংক্ষেপ নিয়ে বাড়ি ফেরেন।</p><p>ওষুধ পর্যালোচনায় তাঁর নিয়মিত আগ্রহ রয়েছে; প্রথম সাক্ষাৎ সাধারণত শুরুর চেয়ে কম সংখ্যক ওষুধ দিয়ে শেষ হয়।</p>"

  philosophy_en: "<p>A prescription the patient does not understand is a prescription they will stop taking. I would rather spend ten minutes explaining why a drug matters than see someone back in six months having quietly abandoned it.</p>"
  philosophy_bn: "<p>রোগী যে ব্যবস্থাপত্র বোঝেন না, সেটি তিনি একসময় বন্ধ করে দেন। কেন একটি ওষুধ জরুরি তা বোঝাতে দশ মিনিট ব্যয় করা আমার কাছে ভালো — ছয় মাস পর কেউ চুপচাপ ওষুধ ছেড়ে দিয়ে ফিরে আসার চেয়ে।</p>"

