  tagline_en: "Straight answers about your heart, in language you can use."
  tagline_bn: "আপনার হৃদযন্ত্র নিয়ে সহজ ভাষায় স্পষ্ট উত্তর।"

  degrees_en: "MBBS, FCPS (Medicine), MD (Cardiology)"
