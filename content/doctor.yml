  short_bio_en: "Dr. Shaikh Saadiul Islam is an orthopaedics, trauma and spine specialist serving as Resident Surgeon at the National Institute of Traumatology and Orthopaedic Rehabilitation (NITOR), Dhaka. He treats knee and lower back pain, disc problems, fractures, spinal disorders, arthritis and bone deformities."
  short_bio_bn: "ডা. শেখ সাদিউল ইসলাম একজন অর্থোপেডিক্স, ট্রমা ও স্পাইন বিশেষজ্ঞ। তিনি জাতীয় অর্থোপেডিক হাসপাতাল ও পুনর্বাসন প্রতিষ্ঠানে (নিটোর) রেসিডেন্ট সার্জন হিসেবে দায়িত্ব পালন করছেন। হাঁটু ও কোমরের ব্যথা, ডিস্ক প্রবলেম, হাড় ভাঙা, স্পাইনের সমস্যা, বাত এবং হাড়ের বিকৃতির চিকিৎসা করেন।"

  bio_en: "<p>Dr. Shaikh Saadiul Islam completed his MBBS at Dhaka Medical College, followed by FCPS and MS in Orthopaedics. He is a Fellow of the American College of Surgeons and a member of the Bangladesh Civil Service (Health) cadre.</p><p>He completed the AO Trauma &amp; Spine advanced course in India and Sri Lanka, and currently serves as Resident Surgeon at the National Institute of Traumatology and Orthopaedic Rehabilitation (NITOR) in Dhaka.</p><p>His practice covers knee and lower back pain, disc problems, fractures following accidents, spinal disorders, arthritis, congenital and acquired bone deformities, and long-term pain management.</p>"
  bio_bn: "<p>ডা. শেখ সাদিউল ইসলাম ঢাকা মেডিকেল কলেজ থেকে এমবিবিএস সম্পন্ন করেন, এরপর অর্থোপেডিক্সে এফসিপিএস ও এমএস ডিগ্রি অর্জন করেন। তিনি আমেরিকান কলেজ অব সার্জনসের ফেলো এবং বাংলাদেশ সিভিল সার্ভিস (স্বাস্থ্য) ক্যাডারের সদস্য।</p><p>ভারত ও শ্রীলঙ্কায় এও ট্রমা অ্যান্ড স্পাইন অ্যাডভান্সড কোর্স সম্পন্ন করেছেন এবং বর্তমানে ঢাকার জাতীয় অর্থোপেডিক হাসপাতাল ও পুনর্বাসন প্রতিষ্ঠানে (নিটোর) রেসিডেন্ট সার্জন হিসেবে কর্মরত।</p><p>হাঁটু ও কোমরের ব্যথা, ডিস্ক প্রবলেম, দুর্ঘটনাজনিত হাড় ভাঙা, স্পাইনের সমস্যা, বাত, জন্মগত ও অর্জিত হাড়ের বিকৃতি এবং দীর্ঘমেয়াদি ব্যথা ব্যবস্থাপনা তাঁর চিকিৎসার আওতাভুক্ত।</p>"

  philosophy_en: "<p>Treatment is not only about physical healing — it is about reassurance as well.</p>"
  philosophy_bn: "<p>চিকিৎসা কেবল শারীরিক আরোগ্যের নয়, মানসিক আশ্বাসেরও বিষয়।</p>"

