# ----------------------------------------------------------------------------
#  Frequently asked questions.
#
#  Every answer below is derived from something already known: his chamber
#  hours as published on saadiul.com, or a setting in this application
#  (config/site.php: 30-day booking window, serials closing an hour before a
#  sitting, three open appointments per phone number). Nothing here is invented
#  — but he should still read them, because they speak on his behalf.
