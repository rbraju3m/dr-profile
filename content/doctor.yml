pages:
  - slug: "privacy-policy"
    title_en: "Privacy Policy"
    title_bn: "গোপনীয়তা নীতি"
    show_in_footer: true
    content_en: "<p>This site collects only what is needed to give you an appointment: your name, your mobile number, and anything you choose to add in the optional fields. If you write to us through the contact form, we keep that message so we can reply.</p><p>Appointment records are visible to the chamber staff who manage the schedule. We do not sell your information and we do not share it with anyone outside the practice.</p><p>No payment is taken on this site, so no card or banking details are ever collected here.</p><p>If you would like your details removed from our records, contact the chamber and we will remove them.</p>"
    content_bn: "<p>আপনাকে অ্যাপয়েন্টমেন্ট দিতে যা প্রয়োজন কেবল তা-ই এই সাইট সংগ্রহ করে: আপনার নাম, মোবাইল নম্বর এবং ঐচ্ছিক ঘরে আপনি যা লিখতে চান। যোগাযোগ ফর্মে বার্তা পাঠালে উত্তর দেওয়ার জন্য সেটি সংরক্ষণ করা হয়।</p><p>অ্যাপয়েন্টমেন্টের তথ্য কেবল চেম্বারের দায়িত্বপ্রাপ্ত কর্মীরা দেখতে পান। আমরা আপনার তথ্য বিক্রি করি না এবং চেম্বারের বাইরে কারও সঙ্গে ভাগ করি না।</p><p>এই সাইটে কোনো পেমেন্ট নেওয়া হয় না, তাই কার্ড বা ব্যাংকিং তথ্য কখনোই সংগ্রহ করা হয় না।</p><p>রেকর্ড থেকে তথ্য মুছে ফেলতে চাইলে চেম্বারে যোগাযোগ করুন।</p>"

  - slug: "terms-of-use"
    title_en: "Terms of Use"
    title_bn: "ব্যবহারের শর্তাবলি"
    show_in_footer: true
    content_en: "<p>The health information on this site is general. It does not replace an examination, and it should not be used to diagnose or treat a condition on your own.</p><p>Booking reserves a serial number. It is not a payment, and it cannot guarantee an exact consultation time — an emergency may delay a sitting, and occasionally a sitting has to be cancelled. Where that happens the chamber will contact you on the number you booked with.</p><p>For a medical emergency, go to your nearest hospital. Do not wait for an appointment.</p>"
    content_bn: "<p>এই সাইটের স্বাস্থ্য তথ্য সাধারণ প্রকৃতির। এটি সরাসরি পরীক্ষার বিকল্প নয় এবং নিজে থেকে রোগ নির্ণয় বা চিকিৎসার জন্য ব্যবহার করা উচিত নয়।</p><p>বুকিং একটি সিরিয়াল নম্বর সংরক্ষণ করে। এটি পেমেন্ট নয় এবং নির্দিষ্ট সময়ে পরামর্শের নিশ্চয়তা দেয় না — জরুরি পরিস্থিতিতে সময় পিছিয়ে যেতে পারে, কখনো বসা বাতিলও হতে পারে। এমন হলে আপনি যে নম্বরে বুক করেছেন সেখানে চেম্বার থেকে জানানো হবে।</p><p>জরুরি চিকিৎসার প্রয়োজনে অ্যাপয়েন্টমেন্টের অপেক্ষা না করে নিকটস্থ হাসপাতালে যান।</p>"
