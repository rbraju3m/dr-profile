; Development-only upload limits for `composer serve`.
;
; artisan serve spawns a child PHP process that re-reads the ini, so -d flags
; on the parent are lost. PHP_INI_SCAN_DIR is inherited by the child, and a
; leading colon means "the system conf.d first, then this" — so the mysql and
; opcache extensions still load normally.
;
; Apache already permits 5G, so this only brings the dev server into line with
; what production accepts.
upload_max_filesize = 16M
post_max_size = 24M
